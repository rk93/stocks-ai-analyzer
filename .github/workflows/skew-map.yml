name: Daily Options Skew Map

on:
  workflow_dispatch:
  schedule:
    # 22:15 UTC safely after the regular US close throughout DST changes.
    - cron: '15 22 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run skew scanner
        run: python skew_map.py
      - name: Persist observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skew_history.csv data/skew_latest.csv data/skew_errors.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily options skew map"
            git push
          fi
