name: Skew Map Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portfolio.test.mjs
      - run: python -m pytest -q tests
      - run: python -m py_compile market_data_provider.py skew_map.py signal_engine.py trending_engine.py day_opportunities.py strategy_v2.py strategy_v3.py paper_trader.py backtest_engine.py prediction_tracker.py skew_dashboard.py confluence_engine.py research_diagnostics.py publish_manifest.py prediction_research.py
