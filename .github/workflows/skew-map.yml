name: Options Skew Map Refresh

on:
  workflow_dispatch:
    inputs:
      backtest_now:
        description: 'Run historical backtest now'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'skew_map.py'
      - 'signal_engine.py'
      - 'trending_engine.py'
      - 'day_opportunities.py'
      - 'prediction_tracker.py'
      - 'backtest_engine.py'
      - 'strategy_v2.py'
      - 'strategy_v3.py'
      - 'paper_trader.py'
      - 'docs/paper-trading.html'
      - 'market_data_provider.py'
      - 'skew_config.json'
      - 'portfolio_config.json'
      - 'requirements.txt'
      - 'docs/index.html'
      - 'docs/trending.html'
      - 'docs/day-opportunities.html'
      - 'docs/prediction-tracker.html'
      - 'docs/backtest.html'
      - '.github/workflows/skew-map.yml'
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '15 22 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skew-refresh-pages
  cancel-in-progress: true

jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run skew scanner
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "*/30 13-21 * * 1-5" ]; then
            SYMBOLS=$(python - <<'PY'
          import json
          print(' '.join(json.load(open('skew_config.json'))['core_universe']))
          PY
          )
            python skew_map.py --symbols $SYMBOLS
          else
            python skew_map.py
          fi
      - name: Build portfolio and entry signals
        run: python signal_engine.py
      - name: Build day opportunities
        run: python day_opportunities.py
      - name: Run shadow paper portfolios
        env:
          PAPER_EXECUTION_MODE: local
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_STRATEGY: V3
        run: python paper_trader.py
      - name: Evaluate saved predictions
        run: python prediction_tracker.py
      - name: Run strategy backtest
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '15 22 * * 1-5'
        run: python backtest_engine.py
      - name: Build trending stock screen
        if: github.event_name != 'schedule' || github.event.schedule != '*/30 13-21 * * 1-5'
        run: python trending_engine.py
      - name: Export GitHub Pages data
        run: |
          mkdir -p docs/data
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd

          def records(path, tail=None):
              p = Path(path)
              if not p.exists():
                  return []
              df = pd.read_csv(p)
              if tail:
                  df = df.tail(tail)
              return json.loads(df.to_json(orient='records'))

          signals = records('data/signals_latest.csv')
          confirmed = [x for x in signals if x.get('research_state') == 'ADD CANDIDATE']
          early = [x for x in signals if x.get('research_state') == 'EARLY CANDIDATE']
          skew_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'latest': records('data/skew_latest.csv'),
              'signals': signals,
              'entry_candidates': confirmed + early,
              'confirmed_entries': confirmed,
              'early_candidates': early,
              'portfolio': [x for x in signals if bool(x.get('in_portfolio'))],
              'history': records('data/skew_history.csv', 5000),
              'errors': records('data/skew_errors.csv'),
          }
          Path('docs/data/skew.json').write_text(json.dumps(skew_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')

          context_path = Path('data/market_context.json')
          context = json.loads(context_path.read_text(encoding='utf-8')) if context_path.exists() else {}
          trending_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'stocks': records('data/trending_latest.csv'),
              'context': context,
          }
          Path('docs/data/trending.json').write_text(json.dumps(trending_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')

          tracker_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'predictions': records('data/prediction_tracker.csv', 5000),
          }
          Path('docs/data/prediction-tracker.json').write_text(json.dumps(tracker_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')

          paper_summary_path = Path('data/paper_summary.json')
          paper_summary = json.loads(paper_summary_path.read_text(encoding='utf-8')) if paper_summary_path.exists() else {}
          paper_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'summary': paper_summary,
              'trades': records('data/paper_trades.csv', 5000),
              'equity': records('data/paper_equity.csv', 5000),
          }
          Path('docs/data/paper-trading.json').write_text(json.dumps(paper_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')

          summary_path = Path('data/backtest_summary.json')
          backtest_summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else {}
          backtest_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'summary': backtest_summary,
              'trades': records('data/backtest_trades.csv'),
          }
          Path('docs/data/backtest.json').write_text(json.dumps(backtest_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')

          day_payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'opportunities': records('data/day_opportunities_latest.csv'),
              'history': records('data/day_opportunities_history.csv', 1000),
          }
          Path('docs/data/day-opportunities.json').write_text(json.dumps(day_payload, allow_nan=False, separators=(',', ':')), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Persist observations and page data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skew_history.csv data/skew_latest.csv data/skew_errors.csv data/signals_latest.csv data/trending_latest.csv data/market_context.json data/day_opportunities_latest.csv data/day_opportunities_history.csv data/predictions.csv data/prediction_tracker.csv data/backtest_trades.csv data/backtest_summary.json data/paper_state.json data/paper_trades.csv data/paper_equity.csv data/paper_summary.json docs/data/skew.json docs/data/trending.json docs/data/day-opportunities.json docs/data/prediction-tracker.json docs/data/backtest.json docs/data/paper-trading.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh research dashboards"
            if ! git push; then
              echo "Data commit raced with another main-branch update; dashboard was already deployed from this run."
            fi
          fi
