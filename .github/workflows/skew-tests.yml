name: Skew Map Tests

on:
  pull_request:
  push:
    branches: [main, feature/skew-map-dashboard]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_skew_map.py
      - run: python -m py_compile skew_map.py skew_dashboard.py
