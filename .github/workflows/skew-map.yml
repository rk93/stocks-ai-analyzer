name: Options Skew Map Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skew_map.py'
      - 'signal_engine.py'
      - 'market_data_provider.py'
      - 'skew_config.json'
      - 'portfolio_config.json'
      - 'requirements.txt'
      - 'docs/index.html'
      - '.github/workflows/skew-map.yml'
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '15 22 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skew-refresh-pages
  cancel-in-progress: true

jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run skew scanner
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "*/30 13-21 * * 1-5" ]; then
            SYMBOLS=$(python - <<'PY'
          import json
          print(' '.join(json.load(open('skew_config.json'))['core_universe']))
          PY
          )
            python skew_map.py --symbols $SYMBOLS
          else
            python skew_map.py
          fi
      - name: Build portfolio and entry signals
        run: python signal_engine.py
      - name: Export GitHub Pages data
        run: |
          mkdir -p docs/data
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd

          def records(path, tail=None):
              p = Path(path)
              if not p.exists():
                  return []
              df = pd.read_csv(p)
              if tail:
                  df = df.tail(tail)
              return json.loads(df.to_json(orient='records'))

          signals = records('data/signals_latest.csv')
          confirmed = [x for x in signals if x.get('research_state') == 'ADD CANDIDATE']
          early = [x for x in signals if x.get('research_state') == 'EARLY CANDIDATE']
          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'latest': records('data/skew_latest.csv'),
              'signals': signals,
              'entry_candidates': confirmed + early,
              'confirmed_entries': confirmed,
              'early_candidates': early,
              'portfolio': [x for x in signals if bool(x.get('in_portfolio'))],
              'history': records('data/skew_history.csv', 5000),
              'errors': records('data/skew_errors.csv'),
          }
          Path('docs/data/skew.json').write_text(
              json.dumps(payload, allow_nan=False, separators=(',', ':')),
              encoding='utf-8'
          )
          PY
      - name: Persist observations and page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skew_history.csv data/skew_latest.csv data/skew_errors.csv data/signals_latest.csv docs/data/skew.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh options skew dashboard"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
